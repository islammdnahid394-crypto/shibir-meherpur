<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইসলামী অনলাইন লাইব্রেরী - ICS Book Reader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }
        header {
            background-color: #1e293b;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: #38bdf8;
        }
        nav a {
            color: #94a3b8;
            margin-left: 1rem;
            text-decoration: none;
            font-weight: 500;
        }
        nav a:hover {
            color: #ffffff;
        }
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 16px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
        }
        .filter-btn.active, .filter-btn:hover {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }
        .book-card {
            background-color: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }
        .cover-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
            background-color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(37, 99, 235, 0.9);
            color: #fff;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .book-info {
            padding: 1rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .book-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #f1f5f9;
        }
        .book-author {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 1rem;
        }
        .btn-group {
            display: flex;
            gap: 8px;
        }
        .btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
        }
        .btn-read {
            background-color: #2563eb;
            color: #fff;
        }
        .btn-download {
            background-color: #334155;
            color: #e2e8f0;
        }
        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ইসলামী অনলাইন লাইব্রেরী</div>
        <nav>
            <a href="#">হোম</a>
            <a href="#">স্কুল সিলেবাস</a>
            <a href="#">কর্মী সিলেবাস</a>
            <a href="#">সাথী সিলেবাস</a>
        </nav>
    </header>

    <div class="container">
        <!-- ফিল্টার বাটন -->
        <div class="filter-buttons">
            <button class="filter-btn active" onclick="filterBooks('all')">সব বই</button>
            <button class="filter-btn" onclick="filterBooks('স্কুল সিলেবাস')">স্কুল সিলেবাস</button>
            <button class="filter-btn" onclick="filterBooks('কর্মী সিলেবাস')">কর্মী সিলেবাস</button>
            <button class="filter-btn" onclick="filterBooks('সাথী সিলেবাস')">সাথী সিলেবাস</button>
        </div>

        <!-- বইয়ের তালিকা -->
        <div class="book-grid" id="bookGrid"></div>
    </div>

    <script>
        // সব বইয়ের ডেটাবেজ
        const books = [
            {
                title: "সাহসী মানুষের গল্প",
                author: "মোশাররফ হোসেন খান",
                category: "স্কুল সিলেবাস",
                cover: "images/sahasi-manuser-golpo.jpg", // ইমেজের পাথ
                pdf: "pdf/sahasi-manuser-golpo.pdf"       // পিডিএফ ফাইল পাথ
            },
            {
                title: "ইসলামের প্রাথমিক পরিচয়",
                author: "বাংলাদেশ দাওয়াহ সার্কেল",
                category: "স্কুল সিলেবাস",
                cover: "images/islamer-prathamik-porichoy.jpg",
                pdf: "pdf/islamer-prathamik-porichoy.pdf"
            },
            {
                title: "রাসূলুল্লাহর বিপ্লবী জীবন",
                author: "মাওলানা মুহা. আবদুর রাজ্জাক",
                category: "সাথী সিলেবাস",
                cover: "images/rasulullahs-biplobi-jibon.jpg",
                pdf: "pdf/rasulullahs-biplobi-jibon.pdf"
            },
            {
                title: "মুসলমানদের পতনে বিশ্ব যা হারালো",
                author: "আবুল হাসান আলী নদভী",
                category: "সাথী সিলেবাস",
                cover: "images/musalmandder-potone.jpg",
                pdf: "pdf/musalmandder-potone.pdf"
            }
            // আরও নতুন বই যোগ করতে এখানে একই ফরম্যাটে অবজেক্ট যোগ করুন
        ];

        function renderBooks(data) {
            const grid = document.getElementById('bookGrid');
            grid.innerHTML = '';

            data.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="cover-wrapper">
                        <span class="badge">${book.category}</span>
                        <img class="cover-img" src="${book.cover}" alt="${book.title}" 
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <div style="display:none; padding:10px; text-align:center; color:#94a3b8;">
                            📖<br>${book.title}
                        </div>
                    </div>
                    <div class="book-info">
                        <div>
                            <div class="book-title">${book.title}</div>
                            <div class="book-author">${book.author}</div>
                        </div>
                        <div class="btn-group">
                            <a href="${book.pdf}" target="_blank" class="btn btn-read">পড়ুন</a>
                            <a href="${book.pdf}" download class="btn btn-download">ডাউনলোড</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterBooks(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (category === 'all') {
                renderBooks(books);
            } else {
                const filtered = books.filter(b => b.category === category);
                renderBooks(filtered);
            }
        }

        // পেজ লোড হলে বই প্রদর্শন
        renderBooks(books);
    </script>
</body>
</html>
