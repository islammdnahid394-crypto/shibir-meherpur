<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICS Book - ইসলামী অনলাইন পাঠাগার</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SolaimanLipi', Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
        }
        header {
            background-color: #1b5e20;
            color: #fff;
            padding: 1rem 2rem;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .filter-section {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .filter-btn {
            background-color: #fff;
            border: 1px solid #2e7d32;
            color: #2e7d32;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .filter-btn.active, .filter-btn:hover {
            background-color: #2e7d32;
            color: #fff;
        }
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .book-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
        }
        .book-card:hover {
            transform: translateY(-4px);
        }
        .cover-container {
            width: 100%;
            height: 250px;
            background-color: #e8f5e9;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .fallback-cover {
            display: none;
            text-align: center;
            padding: 15px;
            color: #2e7d32;
            font-weight: bold;
        }
        .category-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(46, 125, 50, 0.9);
            color: #fff;
            padding: 3px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
        }
        .book-details {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .book-title {
            font-size: 1rem;
            font-weight: bold;
            color: #1b5e20;
            margin-bottom: 5px;
        }
        .book-author {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 15px;
        }
        .action-btns {
            display: flex;
            gap: 8px;
        }
        .btn {
            flex: 1;
            text-align: center;
            padding: 7px 0;
            text-decoration: none;
            font-size: 0.85rem;
            border-radius: 4px;
            font-weight: bold;
        }
        .btn-read {
            background-color: #2e7d32;
            color: #fff;
        }
        .btn-download {
            background-color: #e0e0e0;
            color: #333;
        }
        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <h1>ICS Book Library</h1>
        <p>পাঠ্যসূচী ও সিলেবাসের সকল বইয়ের অনলাইন সংগ্রহ</p>
    </header>

    <div class="container">
        <!-- সিলেবাস ফিল্টার -->
        <div class="filter-section">
            <button class="filter-btn active" onclick="filterCategory('all')">সকল বই</button>
            <button class="filter-btn" onclick="filterCategory('সমর্থক')">সমর্থক সিলেবাস</button>
            <button class="filter-btn" onclick="filterCategory('কর্মী')">কর্মী সিলেবাস</button>
            <button class="filter-btn" onclick="filterCategory('সাথী')">সাথী সিলেবাস</button>
            <button class="filter-btn" onclick="filterCategory('সদস্য')">সদস্য সিলেবাস</button>
        </div>

        <!-- বইয়ের লিস্ট -->
        <div class="book-grid" id="bookGrid"></div>
    </div>

    <script>
        // সিলেবাসের বইয়ের লিস্ট (এখানে সব বই যোগ করতে পারবেন)
        const books = [
            {
                title: "ইসলামের প্রাথমিক পরিচয়",
                author: "বাংলাদেশ দাওয়াহ সার্কেল",
                category: "সমর্থক",
                cover: "images/islamer-porichoy.jpg",
                pdf: "pdf/islamer-porichoy.pdf"
            },
            {
                title: "সাহসী মানুষের গল্প",
                author: "মোশাররফ হোসেন খান",
                category: "সমর্থক",
                cover: "images/sahasi-manus.jpg",
                pdf: "pdf/sahasi-manus.pdf"
            },
            {
                title: "ইসলামী দাওয়াত ও কর্মী",
                author: "মাওলানা মওদূদী",
                category: "কর্মী",
                cover: "images/dawat-o-kormi.jpg",
                pdf: "pdf/dawat-o-kormi.pdf"
            },
            {
                title: "রাসূলুল্লাহর বিপ্লবী জীবন",
                author: "আব্দুর রাজ্জাক",
                category: "সাথী",
                cover: "images/biplobi-jibon.jpg",
                pdf: "pdf/biplobi-jibon.pdf"
            },
            {
                title: "ইসলামী রেনেসাঁ আন্দোলন",
                author: "মাওলানা মওদূদী",
                category: "সদস্য",
                cover: "images/renesa-andolon.jpg",
                pdf: "pdf/renesa-andolon.pdf"
            }
        ];

        function displayBooks(items) {
            const grid = document.getElementById('bookGrid');
            grid.innerHTML = '';

            items.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="cover-container">
                        <span class="category-badge">${book.category}</span>
                        <img class="cover-img" src="${book.cover}" alt="${book.title}" 
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <div class="fallback-cover">
                            📖<br>${book.title}
                        </div>
                    </div>
                    <div class="book-details">
                        <div>
                            <div class="book-title">${book.title}</div>
                            <div class="book-author">${book.author}</div>
                        </div>
                        <div class="action-btns">
                            <a href="${book.pdf}" target="_blank" class="btn btn-read">পড়ুন</a>
                            <a href="${book.pdf}" download class="btn btn-download">ডাউনলোড</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if(cat === 'all') {
                displayBooks(books);
            } else {
                const filtered = books.filter(b => b.category === cat);
                displayBooks(filtered);
            }
        }

        // পেজ লোডে বই প্রর্দশন
        displayBooks(books);
    </script>
</body>
</html>
